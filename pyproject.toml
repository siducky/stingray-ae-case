[project]
name = "stingray-ae-case"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "siducky", email = "siddhant@ducky.eco" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "fastexcel>=0.21.0",
    "marimo[sql]>=0.25.2",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
stingray-ae-case = "stingray_ae_case:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
